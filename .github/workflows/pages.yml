name: Deploy site to GitHub Pages

# Публикует два сайта из одного репозитория:
#   /          -> landing/   (новый лендинг «МатемАтелье»)
#   /site/     -> старый сайт primary.guru (index.html, styles.css, img/, content/, checkList/)

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - 'index.html'
      - 'interactivePage.html'
      - 'script.js'
      - 'scriptPage.js'
      - 'styles.css'
      - 'stylesPage.css'
      - 'img/**'
      - 'content/**'
      - 'checkList/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/site
          # лендинг — в корень
          cp -R landing/. _site/
          # старый сайт — в /site/ (все пути в нём относительные, подпапка работает)
          cp -R index.html interactivePage.html script.js scriptPage.js \
                styles.css stylesPage.css img content checkList _site/site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4