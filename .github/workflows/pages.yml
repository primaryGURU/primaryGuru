name: Deploy site to GitHub Pages

# Публикует всё из одного репозитория:
#   /           -> landing/                      (лендинг «МатемАтелье»)
#   /lessons/   -> lessons/*.html                (автономные интерактивные уроки)
#   /site/      -> всё остальное из репозитория  (primary.guru + любые новые папки)
#
# Новая папка или файл в корне репозитория автоматически публикуется
# по адресу /site/<путь> — править workflow для этого не нужно.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/site

          # лендинг — в корень сайта
          cp -R landing/. _site/

          # автономные уроки — в /lessons/
          mkdir -p _site/lessons
          cp -R lessons/. _site/lessons/

          # старый сайт и любые будущие ресурсы — в /site/.
          # Исключаем только служебное: git, workflow и сам артефакт.
          tar -cf - \
            --exclude=./.git \
            --exclude=./.github \
            --exclude=./_site \
            --exclude=./landing \
            --exclude=./lessons \
            . | tar -xf - -C _site/site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4